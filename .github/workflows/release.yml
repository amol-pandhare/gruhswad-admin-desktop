name: Release desktop apps
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    strategy: { fail-fast: false, matrix: { os: [windows-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    env:
      APP_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - if: runner.os == 'Windows'
        run: pnpm icons:win
      - if: runner.os == 'macOS'
        run: bash scripts/generate-mac-icon.sh
      - name: Configure optional signing
        run: node scripts/configure-signing-env.mjs
        env:
          RELEASE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE || secrets.WINDOWS_CERTIFICATE }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_APPLE_ID: ${{ secrets.APPLE_ID }}
          RELEASE_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RELEASE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: pnpm build
      - run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
