name: Release desktop apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  APP_ENV: prod
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: pnpm release:verify-tag
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @gruhswad/whatsapp-webhook typecheck
      - run: pnpm build

  package-windows:
    name: Package Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:win
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --publish never
      - name: Collect complete Windows release set
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  package-macos:
    name: Package macOS
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/generate-mac-icon.sh
      - run: pnpm build
      - run: pnpm exec electron-builder --mac dmg zip --publish never
      - name: Collect complete macOS release set
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*-mac.zip
            release/*-mac.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [package-windows, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
